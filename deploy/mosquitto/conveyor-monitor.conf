# Local Mosquitto broker for the Conveyor Monitor pipeline.
#
# Install on the Pi:
#   sudo apt install mosquitto mosquitto-clients
#   sudo cp deploy/mosquitto/conveyor-monitor.conf /etc/mosquitto/conf.d/
#   sudo systemctl enable --now mosquitto
#
# Placeholder values below assume the Pi and ESP32 share one LAN/hotspot and
# nothing else does -- see the "network is a phone hotspot" design decision
# in the README. Don't reuse this file as-is on a broker reachable from the
# open internet.

# Listen on all interfaces on the LAN/hotspot, not just loopback -- the
# ESP32 firmware connects to the Pi over the network, not from localhost.
listener 1883 0.0.0.0

# No auth: acceptable only because this broker is not reachable from
# anywhere but the private hotspot network described in the README. Add
# password_file / TLS here before ever exposing this beyond that.
allow_anonymous true

# Durable across broker restarts: QoS 1 messages the broker has accepted
# but not yet delivered to a subscriber (ingest.py, subscribed with
# clean_session=False) survive a `systemctl restart mosquitto` instead of
# being silently lost. This is separate from -- and in addition to -- the
# ESP32's own outbox, which covers captures published while the ESP32 itself
# can't reach the broker at all (see main/app_main.c).
persistence true
persistence_location /var/lib/mosquitto/
